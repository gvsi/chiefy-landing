name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify i18n contracts
        run: |
          pnpm i18n:sync-locales
          pnpm i18n:sync-glossary
          pnpm i18n:verify:contracts

      - name: Check Astro and Pages Functions
        run: |
          pnpm check
          pnpm functions:types:check
          pnpm functions:check
          pnpm functions:build

      - name: Build and verify rendered i18n output
        run: |
          pnpm i18n:build
          pnpm i18n:verify:dist
