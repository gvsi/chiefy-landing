<script>
    (function () {
        if (typeof window === 'undefined' || typeof document === 'undefined') {
            return;
        }

        var UTM_KEYS = [
            'utm_source',
            'utm_medium',
            'utm_campaign',
            'utm_term',
            'utm_content',
            'utm_id',
            'utm_source_platform',
            'utm_creative_format',
            'utm_marketing_tactic',
        ];
        var STORED_PARAM_KEYS = UTM_KEYS.concat(['ref']);
        var STORAGE_KEY = 'duet__utm_params';
        var COOKIE_NAME = 'duet_utms';
        var COOKIE_MAX_AGE = 60 * 60 * 24 * 365; // 1 year

        function sanitizeParams(raw) {
            var result = {};
            if (!raw) {
                return result;
            }
            for (var i = 0; i < STORED_PARAM_KEYS.length; i++) {
                var key = STORED_PARAM_KEYS[i];
                var value = raw[key];
                if (typeof value === 'string') {
                    var trimmed = value.trim();
                    if (trimmed) {
                        result[key] = trimmed.slice(0, 200);
                    }
                }
            }
            return result;
        }

        function readCookie() {
            var cookies = document.cookie ? document.cookie.split(';') : [];
            for (var i = 0; i < cookies.length; i++) {
                var cookie = cookies[i].trim();
                if (cookie.indexOf(COOKIE_NAME + '=') === 0) {
                    var value = cookie.substring(COOKIE_NAME.length + 1);
                    try {
                        var decoded = decodeURIComponent(value);
                        var parsed = JSON.parse(decoded);
                        if (parsed && typeof parsed === 'object') {
                            return sanitizeParams(parsed);
                        }
                    } catch (error) {
                        console.warn('[duet-utms] Failed to parse cookie', error);
                    }
                }
            }
            return {};
        }

        function writeCookie(params) {
            try {
                var encoded = encodeURIComponent(JSON.stringify(params));
                var host = window.location.hostname || '';
                var parts = host.split('.');
                var domain = '';
                if (parts.length >= 2) {
                    domain = parts.slice(-2).join('.');
                } else {
                    domain = host;
                }
                var directives = [
                    COOKIE_NAME + '=' + encoded,
                    'Max-Age=' + COOKIE_MAX_AGE,
                    'Path=/',
                    'SameSite=Lax',
                    'Secure',
                ];
                if (domain && domain !== 'localhost') {
                    directives.push('Domain=' + '.' + domain);
                }
                document.cookie = directives.join('; ');
            } catch (error) {
                console.warn('[duet-utms] Failed to set cookie', error);
            }
        }

        function writeLocalStorage(params) {
            try {
                window.localStorage.setItem(STORAGE_KEY, JSON.stringify(params));
            } catch (error) {
                console.warn('[duet-utms] Failed to persist localStorage', error);
            }
        }

        function captureUtmsFromUrl() {
            var params = new URLSearchParams(window.location.search || '');
            var collected = {};
            var hasValue = false;
            for (var i = 0; i < UTM_KEYS.length; i++) {
                var key = UTM_KEYS[i];
                var value = params.get(key);
                if (value) {
                    collected[key] = value;
                    hasValue = true;
                }
            }
            var ref = params.get('ref');
            if (ref) {
                if (/^[a-z0-9]{4,16}$/.test(ref)) {
                    collected.ref = ref;
                    hasValue = true;
                }
                if (!collected.utm_source) {
                    collected.utm_source = ref;
                    hasValue = true;
                }
            }
            if (!hasValue) {
                return {};
            }
            return sanitizeParams(collected);
        }

        // ── First-party analytics gate (SC-1) ────────────────────────────────
        // The /referral/click beacon + the UTM cookie/localStorage writes are
        // first-party attribution that Consent Mode does NOT govern. They must run
        // only when analytics consent is granted, mirroring the app's
        // getFirstPartyAnalyticsConsent: stored granted => granted; stored denied
        // => denied; no stored choice => granted iff edge region is non-EEA, else
        // pending (held in memory, flushed by the banner on Accept). Non-EEA users
        // see no behavioural change (granted by default).
        function readStoredConsent() {
            var cookies = document.cookie ? document.cookie.split(';') : [];
            for (var i = 0; i < cookies.length; i++) {
                var cookie = cookies[i].trim();
                if (cookie.indexOf('chiefy_consent=') === 0) {
                    var value = cookie.substring('chiefy_consent='.length).trim();
                    if (value === 'granted' || value === 'denied') return value;
                    return null;
                }
            }
            return null;
        }

        // Edge region signal (SC-1a). FAIL-SAFE to EEA when absent/unknown.
        function getConsentRegion() {
            var raw = null;
            try {
                var meta = document.querySelector('meta[name="cf-region"]');
                raw = meta ? meta.getAttribute('content') : null;
                if (!raw && typeof window.__CF_REGION__ === 'string') {
                    raw = window.__CF_REGION__;
                }
            } catch (e) {
                return 'eea';
            }
            var normalized = raw ? raw.trim().toLowerCase() : '';
            if (normalized === 'non-eea') return 'non-eea';
            return 'eea';
        }

        function firstPartyConsent() {
            var stored = readStoredConsent();
            if (stored === 'granted') return 'granted';
            if (stored === 'denied') return 'denied';
            return getConsentRegion() === 'non-eea' ? 'granted' : 'pending';
        }

        // The actual first-party work (beacon + UTM persistence). Runs immediately
        // when consent is granted, or is held and re-run by the banner on Accept.
        function runFirstPartyAnalytics() {
            // Step 2: click beacon — fires before early-return so returning visitors are counted
            try {
                var beaconRef = new URLSearchParams(window.location.search || '').get('ref');
                if (beaconRef && /^[a-z0-9]{4,16}$/.test(beaconRef) && navigator.sendBeacon) {
                    navigator.sendBeacon(
                        'https://api.duetmail.com/referral/click',
                        new Blob([JSON.stringify({ code: beaconRef })], { type: 'text/plain' })
                    );
                }
            } catch (error) {
                /* analytics only — never break the page */
            }

            var existingCookie = readCookie();
            var urlRefValue = new URLSearchParams(window.location.search || '').get('ref');
            if (Object.keys(existingCookie).length > 0) {
                if (urlRefValue && /^[a-z0-9]{4,16}$/.test(urlRefValue) && existingCookie.ref !== urlRefValue) {
                    existingCookie.ref = urlRefValue;
                    writeCookie(existingCookie);
                }
                writeLocalStorage(existingCookie);
                return;
            }

            var urlParams = captureUtmsFromUrl();
            if (Object.keys(urlParams).length > 0) {
                writeCookie(urlParams);
                writeLocalStorage(urlParams);
            }
        }

        var consent = firstPartyConsent();
        if (consent === 'granted') {
            runFirstPartyAnalytics();
        } else if (consent === 'pending') {
            // EEA / unknown region, no choice yet: hold. The banner's Accept handler
            // calls this to flush; idempotent (re-running is safe). On Reject it is
            // never called, so nothing is written.
            window.__chiefyFlushFirstParty = runFirstPartyAnalytics;
        }
        // consent === 'denied' => drop entirely (no beacon, no writes).
    })();
</script>
